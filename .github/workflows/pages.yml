name: Publish Ironclad Games
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test games and save handling
        run: node --test tests/auth.test.js tests/catalog.test.js tests/controller.test.js tests/frame-host.test.js tests/games.test.js tests/save-store.test.js
      - name: Verify static assets
        run: node scripts/verify-site.mjs
      - uses: actions/configure-pages@v5
      - name: Assemble public site only
        run: |
          mkdir -p dist/assets
          cp index.html settings.html proxy-sw.js dist/
          cp assets/site.css assets/icon.svg assets/drive-mad.png assets/retro-bowl.png assets/slope.png assets/drift-hunters.png assets/snow-rider-3d.png assets/ovo.png assets/moto-x3m-spooky-land.png assets/stacktris.png assets/rocket-soccer-derby.png assets/moto-x3m.png assets/eggy-car.png assets/moto-x3m-2.png assets/moto-x3m-winter.png assets/ovo-2.png assets/potato-league.png dist/assets/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
