function installGolfBridge(host, storage, send) {

 for(const name of falseGetters)host[name]=()=>'false';
 const emptyGetters=['getPlatformPayload','getPlatformTld','getPlayerId','getPlayerName','getPlayerPhotos','getPlayerExtra','getRewardedPlacement'];
 for(const name of emptyGetters)host[name]=()=>'';
 Object.assign(host,{
  getPlatformId:()=>'mock',getPlatformLanguage:()=>'en',getDeviceType:()=>'desktop',getIsPlatformAudioEnabled:()=>'true',getVisibilityState:()=>'visible',getLeaderboardsType:()=>'not_available',
  getStorageDefaultType:()=>'local_storage',getIsStorageSupported:type=>String(type==='local_storage'),getIsStorageAvailable:type=>String(type==='local_storage'),

  sendMessageToPlatform:()=>{},getServerTime:()=>send('OnGetServerTimeCompleted',String(Date.now())),

<script>
const canvas=document.getElementById('canvas'),status=document.getElementById('status');
const source='https://cdn.jsdelivr.net/gh/fedosyamamontova/config@702ad8dd2e653c3b29446973add145b925d98b25/src/';
let instance=null;const pending=[];
function send(name,value){if(instance)instance.SendMessage('PlaygamaBridge',name,value);else pending.push([name,value]);}
// Resolve storage lazily so a browser denying storage does not prevent startup.
installGolfBridge(window,{getItem:key=>localStorage.getItem(key),setItem:(key,value)=>localStorage.setItem(key,value),removeItem:key=>localStorage.removeItem(key)},send);

 instance=await createUnityInstance(canvas,{dataUrl:source+'go.d.js',frameworkUrl:source+'go.f.js',codeUrl:source+'go.w.js',streamingAssetsUrl:source+'sa',companyName:'PinpinTeam',productName:'Golf Orbit',productVersion:'1.0'},progress=>{status.textContent='Loading Golf Orbit... '+Math.round(progress*100)+'%';});
 for(const [name,value] of pending.splice(0))send(name,value);status.hidden=true;canvas.focus();
}catch(error){console.error('Golf Orbit startup failed',error);fail();}};
document.head.append(loader);
