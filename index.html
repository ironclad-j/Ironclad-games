<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Play Drive Mad on Ironclad Games.">
  <title>Ironclad Games</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css?v=drive-1">
</head>
<body>
  <div class="site">
    <header class="header">
      <a class="brand" href="./" aria-label="Ironclad Games home">Ironclad<span>Games</span></a>
    </header>
    <main id="main">
      <section id="library-view">
        <div class="page-heading"><h1>Games</h1></div>
        <div class="game-grid">
          <article class="game-card">
            <div class="game-art" style="--card-bg:#191919">
              <svg viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#191919" d="M0 0h320v180H0z"/><path d="M0 140h105l40-30 40 10 40-30h95" stroke="#55554f" stroke-width="12"/><g transform="translate(155 84) rotate(-12)"><path d="M-49 0h98v28h-98zM-27-23h49L39 0h-78z" fill="#b7b7ab"/><path d="M-20-17h36L27-3h-56z" fill="#292929"/><circle cx="-30" cy="30" r="16" fill="#161616" stroke="#a4a49b" stroke-width="6"/><circle cx="32" cy="30" r="16" fill="#161616" stroke="#a4a49b" stroke-width="6"/></g></svg>
            </div>
            <div class="game-content"><div class="game-title"><h2>Drive Mad</h2><span class="category">Driving</span></div><p>Keep your balance and reach the finish.</p><button class="play-button" id="play-drive" aria-label="Play Drive Mad">Play</button></div>
          </article>
        </div>
      </section>
      <section id="player-view" hidden>
        <div class="player-heading"><button class="text-button" id="back-library">&larr; Games</button><span>Use the controls shown in the game.</span></div>
        <div class="player-toolbar"><h1>Drive Mad</h1><div><button class="button" id="fullscreen">Fullscreen</button></div></div>
        <div class="frame-container" id="frame-container"></div>
        <p id="player-message" role="status"></p>
      </section>
    </main>
  </div>
  <div class="desktop-notice"><h1>Ironclad Games</h1><p>Use a wider window to play.</p></div>
  <script>
    const library=document.getElementById('library-view'),player=document.getElementById('player-view'),container=document.getElementById('frame-container'),message=document.getElementById('player-message');
    document.getElementById('play-drive').addEventListener('click',()=>{
      const frame=document.createElement('iframe');frame.id='plyIframe';frame.title='Drive Mad';frame.allow='fullscreen; autoplay';frame.allowFullscreen=true;frame.sandbox='allow-scripts allow-same-origin allow-forms allow-pointer-lock';frame.referrerPolicy='strict-origin';
      message.textContent='Loading Drive Mad...';frame.addEventListener('load',()=>{message.textContent='';frame.focus();});
      frame.src='https://ubghyper.github.io/GameList.github.io/Drive-Mad/';container.replaceChildren(frame);library.hidden=true;player.hidden=false;window.scrollTo(0,0);
    });
    document.getElementById('back-library').addEventListener('click',()=>{container.replaceChildren();player.hidden=true;library.hidden=false;document.getElementById('play-drive').focus();});
    document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await container.requestFullscreen();container.querySelector('iframe')?.focus();}catch{message.textContent='Fullscreen is unavailable. You can keep playing here.';}});
  </script>
</body>
</html>
