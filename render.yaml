services:
  - type: web
    name: ironclad-browser-test
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod --ignore-scripts
    startCommand: node scripts/render-wisp.mjs
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: ALLOWED_ORIGIN
        value: https://ironclad-j.github.io
